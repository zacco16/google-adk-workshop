<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Planner AI</title>
  <!-- Lightweight markdown rendering; falls back to plain text if it fails to load -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --user: #2563eb;
      --agent: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      background: var(--panel);
      border-bottom: 1px solid #334155;
      font-weight: 600;
      font-size: 18px;
    }
    header span { color: var(--accent); }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 720px;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: normal;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agent {
      align-self: flex-start;
      background: var(--agent);
      border-bottom-left-radius: 4px;
    }
    .msg.agent p:first-child { margin-top: 0; }
    .msg.agent p:last-child { margin-bottom: 0; }
    .msg.agent ul { margin: 6px 0; padding-left: 20px; }
    .msg.thinking { color: var(--muted); font-style: italic; }
    #composer {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      background: var(--panel);
      border-top: 1px solid #334155;
    }
    #query {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      font-size: 15px;
    }
    #query:focus { outline: none; border-color: var(--accent); }
    button {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  </style>
</head>
<body>
  <header>✈️ Travel Planner <span>AI</span></header>
  <div id="chat">
    <div class="empty" id="empty">Ask about a destination — e.g. "Best things to do in Paris in spring?"</div>
  </div>
  <form id="composer">
    <input id="query" type="text" placeholder="Where do you want to go?" autocomplete="off" autofocus />
    <button type="submit" id="send">Send</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("composer");
    const input = document.getElementById("query");
    const sendBtn = document.getElementById("send");
    const empty = document.getElementById("empty");

    function addMessage(text, role, isMarkdown = false) {
      if (empty) empty.remove();
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      if (isMarkdown && window.marked) {
        div.innerHTML = window.marked.parse(text);
      } else {
        div.textContent = text;
        div.style.whiteSpace = "pre-wrap";
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      addMessage(query, "user");
      input.value = "";
      sendBtn.disabled = true;
      const thinking = addMessage("Planning…", "agent");
      thinking.classList.add("thinking");

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query }),
        });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        thinking.remove();
        addMessage(data.response, "agent", true);
      } catch (err) {
        thinking.remove();
        addMessage(`⚠️ ${err.message}`, "agent");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
